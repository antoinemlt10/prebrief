name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e . pytest
          python -m spacy download en_core_web_sm
      - name: Test
        # The suite never touches the network: every fetch in it goes through a
        # seeded, offline cache. A test that needed the internet would be a test
        # that fails for reasons unrelated to the code.
        run: pytest -q
